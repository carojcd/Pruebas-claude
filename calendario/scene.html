<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LITIVO — Calendario flotante</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: 'Inter Tight'; font-weight: 500; src: url(fonts/inter-tight-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter Tight'; font-weight: 600; src: url(fonts/inter-tight-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter Tight'; font-weight: 700; src: url(fonts/inter-tight-latin-700-normal.woff2) format('woff2'); }
:root { --aqua: #63C2C8; --teal: #3E9891; --dark: #19292C; --aqua-l: #DCF6F3; --gray-l: #DDE2E5; --cell: #EFF8F7;
  --aqua-rgb: 99, 194, 200; --teal-rgb: 62, 152, 145; --dark-rgb: 25, 41, 44; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--dark); }
body { font-family: 'Inter Tight', sans-serif; -webkit-font-smoothing: antialiased; color: var(--dark); }
#stage { position: absolute; inset: 0; overflow: hidden;
  background: radial-gradient(110% 55% at 50% 108%, rgba(var(--teal-rgb), .22), transparent 62%), radial-gradient(90% 45% at 50% -6%, rgba(var(--teal-rgb), .14), transparent 66%), var(--dark); }
#halo { position: absolute; left: 540px; top: 960px; width: 1900px; height: 1900px; margin: -950px 0 0 -950px; border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--aqua-rgb), .24) 0%, rgba(var(--teal-rgb), .1) 34%, transparent 66%); opacity: 0; }
#arcs { position: absolute; left: -60px; top: 360px; width: 1200px; height: 1200px; opacity: 0; }
#persp { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 540px 960px; }
#cam { position: absolute; left: 540px; top: 960px; transform-style: preserve-3d; }
#card { position: absolute; left: -450px; top: -415px; width: 900px; height: 830px; transform-style: preserve-3d; }
#card > * { position: absolute; transform-style: flat; }
.shadow { left: 50px; top: 700px; width: 800px; height: 160px; border-radius: 50%; background: rgba(8, 16, 18, .7); filter: blur(40px); }
.hglow { left: -110px; top: -110px; width: 1120px; height: 1050px; border-radius: 140px;
  background: radial-gradient(closest-side, rgba(var(--aqua-rgb), .42), rgba(var(--teal-rgb), .16) 62%, transparent); }
.face { inset: 0; border-radius: 22px; background: #FFFFFF; border: 1px solid var(--gray-l); }
.edge { inset: -2px; border-radius: 24px; border: 2px solid rgba(var(--aqua-rgb), 1);
  box-shadow: 0 0 8px rgba(var(--aqua-rgb), .95), 0 0 30px rgba(var(--aqua-rgb), .6), 0 0 90px rgba(var(--teal-rgb), .5), inset 0 0 18px rgba(var(--aqua-rgb), .3); }
.sweep { inset: -4px; border-radius: 26px; padding: 3.5px;
  background: conic-gradient(from var(--ang, 0deg), transparent 0deg, transparent 240deg, rgba(var(--aqua-rgb), .9) 320deg, #FFFFFF 350deg, rgba(var(--aqua-rgb), .9) 355deg, transparent 360deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  filter: drop-shadow(0 0 8px rgba(var(--aqua-rgb), .9)); }
.head { left: 19px; top: 18px; width: 862px; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 18px; font-weight: 600; }
.head svg { width: 20px; height: 20px; fill: none; stroke: var(--dark); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.wd { top: 78px; width: 118px; text-align: center; font-size: 11.5px; font-weight: 600; color: rgba(var(--dark-rgb), .7); letter-spacing: .03em; }
.cell { width: 118px; height: 74px; border-radius: 9px; background: var(--cell); font-size: 13.5px; font-weight: 600; }
.cell b { position: absolute; left: 17px; top: 28px; font-weight: 600; }
.cell.out { background: transparent; color: rgba(var(--dark-rgb), .45); font-weight: 500; }
.cell.ev { background: #FFFFFF; border: 1px solid #CDD4D7; }
.cell.ev b { top: 16px; left: 13px; }
.pill { position: absolute; left: 6px; right: 6px; top: 42px; height: 18px; border-radius: 4px; background: var(--aqua-l); color: var(--teal);
  font-size: 11px; font-weight: 500; padding-left: 6px; line-height: 18px; transform-origin: 0 50%; }
.cell.sel { background: #D3F4EE; border: 1px solid var(--teal); }
.cell.sel b { left: 7px; top: 8px; width: 22px; height: 22px; border-radius: 50%; background: #5BBFC6; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.cell.sel i { position: absolute; left: 11px; font-style: normal; font-size: 11px; font-weight: 500; color: rgba(var(--dark-rgb), .8); }
.ring { border-radius: 11px; box-shadow: 0 0 0 2px rgba(var(--aqua-rgb), .95), 0 0 26px 4px rgba(var(--aqua-rgb), .55); }
.div { left: 19px; top: 594px; width: 862px; height: 1px; background: var(--gray-l); transform-origin: 0 50%; }
.hoy { left: 19px; top: 612px; font-size: 11.5px; font-weight: 700; color: rgba(var(--dark-rgb), .8); letter-spacing: .02em; }
.aud { left: 19px; width: 862px; height: 80px; border-radius: 11px; border: 1px solid #CDD4D7; background: #FFFFFF; }
.aud .ib { position: absolute; left: 11px; top: 21px; width: 36px; height: 36px; border-radius: 9px; background: var(--aqua-l); display: grid; place-items: center; }
.aud .ib svg { width: 19px; height: 19px; fill: none; stroke: var(--teal); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.aud .t { position: absolute; left: 58px; top: 11px; font-size: 13.5px; font-weight: 500; color: var(--teal); }
.aud .n { position: absolute; left: 58px; top: 30px; font-size: 15.5px; font-weight: 700; }
.aud .s { position: absolute; left: 58px; top: 52px; font-size: 13px; font-weight: 500; color: rgba(var(--dark-rgb), .78); }
.aud .badge { position: absolute; right: 11px; top: 28px; height: 22px; padding: 0 9px; border-radius: 11px; background: var(--aqua-l); color: var(--teal);
  font-size: 10px; font-weight: 700; letter-spacing: .04em; line-height: 22px; }
#vignette { position: absolute; inset: 0; background: radial-gradient(120% 75% at 50% 50%, transparent 55%, rgba(14, 24, 26, .55) 100%); }
</style>
</head>
<body>
<div id="stage">
  <div id="halo"></div>
  <svg id="arcs" viewBox="-600 -600 1200 1200"><g fill="none" stroke="#63C2C8" stroke-linecap="round">
    <path d="M-222 -436A490 490 0 0 1 222 -436" stroke-width="2.4" opacity=".5"/><path d="M-222 436A490 490 0 0 0 222 436" stroke-width="2.4" opacity=".5"/>
    <path d="M-258 -508A570 570 0 0 1 258 -508" stroke-width="1.2" opacity=".25"/><path d="M-258 508A570 570 0 0 0 258 508" stroke-width="1.2" opacity=".25"/></g></svg>
  <div id="persp"><div id="cam"><div id="card"></div></div></div>
  <div id="vignette"></div>
</div>
<script type="module" src="scene.js"></script>
</body>
</html>
