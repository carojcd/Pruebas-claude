<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LITIVO — Buscador flotante</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: 'Inter Tight'; font-weight: 500; src: url(fonts/inter-tight-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter Tight'; font-weight: 600; src: url(fonts/inter-tight-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter Tight'; font-weight: 700; src: url(fonts/inter-tight-latin-700-normal.woff2) format('woff2'); }
:root {
  --aqua: #63C2C8; --teal: #3E9891; --dark: #19292C; --white: #FFFFFF; --aqua-l: #DCF6F3; --gray-l: #DDE2E5;
  --aqua-rgb: 99, 194, 200; --teal-rgb: 62, 152, 145; --dark-rgb: 25, 41, 44;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--dark); }
body { font-family: 'Inter Tight', sans-serif; -webkit-font-smoothing: antialiased; }

#stage { position: absolute; inset: 0; overflow: hidden;
  background:
    radial-gradient(110% 55% at 50% 108%, rgba(var(--teal-rgb), .22), transparent 62%),
    radial-gradient(90% 45% at 50% -6%, rgba(var(--teal-rgb), .14), transparent 66%),
    var(--dark); }
#halo { position: absolute; left: 540px; top: 960px; width: 1700px; height: 1700px; margin: -850px 0 0 -850px; border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--aqua-rgb), .26) 0%, rgba(var(--teal-rgb), .11) 34%, transparent 66%); opacity: 0; }
#arcs { position: absolute; left: 0; top: 420px; width: 1080px; height: 1080px; opacity: 0; }

#persp { position: absolute; inset: 0; perspective: 1300px; perspective-origin: 540px 960px; }
#cam { position: absolute; left: 540px; top: 960px; width: 0; height: 0; transform-style: preserve-3d; }
#cam * { transform-style: preserve-3d; }
.flat, .flat * { transform-style: flat !important; }

/* Buscador: 900 × 156, centrado en el origen de la cámara */
#bar { position: absolute; left: -450px; top: -78px; width: 900px; height: 156px; transform-origin: 50% 50%; }
.shadow { position: absolute; left: 40px; top: 120px; width: 820px; height: 90px; border-radius: 50%;
  background: rgba(8, 16, 18, .75); filter: blur(28px); }
.halo-glow { position: absolute; left: -90px; top: -90px; width: 1080px; height: 336px; border-radius: 170px;
  background: radial-gradient(closest-side, rgba(var(--aqua-rgb), .55), rgba(var(--teal-rgb), .2) 60%, transparent); opacity: 0; }
.face { position: absolute; inset: 0; border-radius: 78px; background: var(--white); border: 1px solid var(--gray-l);
  box-shadow: inset 0 -6px 16px rgba(var(--dark-rgb), .06); overflow: hidden; }
.spec { position: absolute; inset: -60% -20%; background: linear-gradient(105deg, transparent 40%, rgba(var(--aqua-rgb), .14) 47%, rgba(255,255,255,.75) 50%, rgba(var(--aqua-rgb), .14) 53%, transparent 60%);
  transform: translateX(var(--spec, -120%)); opacity: var(--specO, 0); }
.icon { position: absolute; left: 50px; top: 46px; width: 64px; height: 64px; color: var(--teal); }
.icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.field { position: absolute; left: 140px; top: 0; height: 156px; display: flex; align-items: center; }
.placeholder { position: absolute; left: 0; top: 0; height: 156px; display: flex; align-items: center; font-size: 56px; font-weight: 500; color: rgba(var(--dark-rgb), .38); white-space: nowrap; }
#typed { font-size: 60px; font-weight: 600; color: var(--dark); letter-spacing: -.01em; white-space: nowrap; display: flex; }
#typed span { display: inline-block; }
#typed span.dom { color: var(--teal); }
#caret { width: 4px; height: 66px; margin-left: 4px; border-radius: 2px; background: var(--teal); }
.btn { position: absolute; right: 18px; top: 18px; width: 120px; height: 120px; border-radius: 50%; background: var(--aqua);
  display: grid; place-items: center; color: var(--dark); transform-origin: 50% 50%; }
.btn svg { width: 54px; height: 54px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.btn-glow { position: absolute; inset: -16px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(var(--aqua-rgb), .9), 0 0 34px 6px rgba(var(--aqua-rgb), .55); opacity: 0; }

/* Neón (mismo sistema de capas que la pieza cinematográfica) */
.neon-edge { position: absolute; inset: -2px; border-radius: 80px; border: 2px solid rgba(var(--aqua-rgb), 1);
  box-shadow: 0 0 8px rgba(var(--aqua-rgb), .95), 0 0 28px rgba(var(--aqua-rgb), .6), 0 0 80px rgba(var(--teal-rgb), .5), inset 0 0 18px rgba(var(--aqua-rgb), .35);
  opacity: 0; }
.neon-sweep { position: absolute; inset: -4px; border-radius: 82px; padding: 3.5px; opacity: 0;
  background: conic-gradient(from var(--ang, 0deg), transparent 0deg, transparent 240deg, rgba(var(--aqua-rgb), .9) 320deg, #FFFFFF 350deg, rgba(var(--aqua-rgb), .9) 355deg, transparent 360deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  filter: drop-shadow(0 0 8px rgba(var(--aqua-rgb), .9)); }

#vignette { position: absolute; inset: 0; background: radial-gradient(120% 75% at 50% 50%, transparent 55%, rgba(14, 24, 26, .55) 100%); }
</style>
</head>
<body>
<div id="stage">
  <div id="halo"></div>
  <svg id="arcs" viewBox="-540 -540 1080 1080">
    <g fill="none" stroke="#63C2C8" stroke-linecap="round">
      <path d="M-197.6 -387.8A435 435 0 0 1 197.6 -387.8" stroke-width="2.4" opacity=".5"/>
      <path d="M-197.6 387.8A435 435 0 0 0 197.6 387.8" stroke-width="2.4" opacity=".5"/>
      <path d="M-232.6 -456.5A512 512 0 0 1 232.6 -456.5" stroke-width="1.2" opacity=".25"/>
      <path d="M-232.6 456.5A512 512 0 0 0 232.6 456.5" stroke-width="1.2" opacity=".25"/>
    </g>
  </svg>
  <div id="persp">
    <div id="cam">
      <div id="bar">
        <div class="shadow flat" id="shadow"></div>
        <div class="halo-glow flat" id="barHalo"></div>
        <div class="face flat" id="face">
          <div class="icon"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L20.5 20.5"/></svg></div>
          <div class="field">
            <div class="placeholder" id="placeholder">Buscar en LITIVO…</div>
            <div id="typed"></div><div id="caret"></div>
          </div>
          <div class="btn" id="btn"><div class="btn-glow" id="btnGlow"></div><svg viewBox="0 0 24 24"><path d="M4.5 12h14.5M13.5 6.5L19 12l-5.5 5.5"/></svg></div>
          <div class="spec" id="spec"></div>
        </div>
        <div class="neon-edge flat" id="edge"></div>
        <div class="neon-sweep flat" id="sweep"></div>
      </div>
    </div>
  </div>
  <div id="vignette"></div>
</div>
<script type="module" src="scene.js"></script>
</body>
</html>
